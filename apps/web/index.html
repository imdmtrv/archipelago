    <style>
      .app-loader{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;background:linear-gradient(180deg,#7FBFE6 0%,#FBE3C8 100%);color:#1F2A44}
      .app-loader__icon{width:88px;height:88px;display:block}
      .app-loader__title{margin-top:18px;font:700 28px Unbounded,system-ui,sans-serif}
      .app-loader__track{position:relative;width:160px;height:6px;margin-top:18px;border-radius:3px;overflow:hidden;background:rgba(31,42,68,.12)}
      .app-loader__track span{position:absolute;top:0;left:0;width:40%;height:100%;border-radius:3px;background:#F5B83D;animation:loader-slide 1.2s ease-in-out infinite alternate}
      @keyframes loader-slide{from{transform:translateX(0)}to{transform:translateX(150%)}}
      @media (prefers-reduced-motion:reduce){.app-loader__track span{animation:none;left:30%}}
    </style>
  </head>
  <body>
    <div id="root">
      <div class="app-loader" role="status" aria-label="Архипелаг загружается">
        <svg class="app-loader__icon" viewBox="0 0 26 26" aria-hidden="true">
          <rect width="26" height="26" rx="6" fill="#3E9A9A" />
          <circle cx="17" cy="9" r="4.5" fill="#F5B83D" />
          <path d="M3 17c2.5 0 2.5-2 5-2s2.5 2 5 2 2.5-2 5-2 2.5 2 5 2" fill="none" stroke="#FFFBF3" stroke-width="2.4" stroke-linecap="round" />
          <path d="M3 21.5c2.5 0 2.5-2 5-2s2.5 2 5 2 2.5-2 5-2 2.5 2 5 2" fill="none" stroke="#FFFBF3" stroke-opacity=".55" stroke-width="2.4" stroke-linecap="round" />
        </svg>
        <div class="app-loader__title">Архипелаг</div>
        <div class="app-loader__track"><span></span></div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
